name: Seal independently reviewed candidate
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful candidate run from this exact source commit
        required: true
      agent_run_ids:
        description: Comma-separated successful actual smoke and full run IDs
        required: true
      candidate_manifest_sha256:
        description: Exact prepared manifest identity reviewed
        required: true
      review_commit:
        description: Full evidence commit with reviewed/ containing only approved summaries, receipts, assessments and reviewer inputs
        required: true
permissions:
  contents: read
  actions: read
jobs:
  seal:
    if: github.repository == 'shendeguize/AgentOrganon' && github.ref == 'refs/heads/release/1.0.0'
    environment: release-validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Validate immutable review source
        env:
          REVIEW_COMMIT: ${{ inputs.review_commit }}
        run: node -e 'if(!/^[a-f0-9]{40}$/.test(process.env.REVIEW_COMMIT)) throw Error("Full review commit required")'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.review_commit }}
          path: review-input
          persist-credentials: false
          sparse-checkout: reviewed
      - name: Collect exact trusted runs and data-only independent reviews
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          AGENT_RUNS: ${{ inputs.agent_run_ids }}
          MANIFEST_SHA: ${{ inputs.candidate_manifest_sha256 }}
        run: node scripts/release/collect.mjs --candidate-run "$CANDIDATE_RUN" --agent-runs "$AGENT_RUNS" --manifest-sha256 "$MANIFEST_SHA" --reviews review-input/reviewed --out candidate
      - name: Collect passed assessments and require every release gate
        run: |
          node scripts/release/assemble.mjs --manifest candidate/release-manifest.json --reports candidate --out candidate/assembled.json
          node scripts/release/manifest.mjs seal --manifest candidate/assembled.json --out candidate/release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-release-${{ github.run_attempt }}
          path: candidate/
          if-no-files-found: error
          retention-days: 30
